# CI/CD Pipeline for Flight Analyzer Backend
name: 🧪 CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**', 'hotfix/**', 'ci/**']
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '18'

jobs:
  # 코드 품질 검사
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: 🎨 Check code formatting (Black)
      run: black --check app/ tests/ --line-length 88

    - name: 📦 Check import sorting (isort)
      run: isort --check-only app/ tests/ --profile black

    - name: 🔍 Lint with Flake8
      run: |
        flake8 app/ tests/ --max-line-length=88 \
               --extend-ignore=E203,W503,E501 \
               --exclude=migrations,venv,.venv \
               --max-complexity=10

    - name: 🏷️ Type checking (MyPy)
      run: mypy app/ --ignore-missing-imports

    - name: 🛡️ Security check (Bandit)
      run: bandit -r app/ -f json -o bandit-report.json
      continue-on-error: true

    - name: 📋 Docstring check (Pydocstyle)
      run: |
        pydocstyle app/ --convention=google \
                        --add-ignore=D100,D101,D102,D103,D104,D105
      continue-on-error: true

    - name: 🕵️ Secret detection
      run: |
        detect-secrets scan --baseline .secrets.baseline || true

  # 단위 테스트
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality

    strategy:
      matrix:
        python-version: ['3.12']

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: 🔐 Generate test SECRET_KEY
      run: |
        echo "SECRET_KEY=test-secret-key-for-ci-at-least-32-characters-long" >> .env
        echo "ENVIRONMENT=test" >> .env
        echo "DEBUG=false" >> .env
        echo "REDIS_URL=redis://localhost:6379/0" >> .env
        echo "USE_REAL_AMADEUS=false" >> .env

    - name: 🧪 Run unit tests
      run: |
        pytest tests/ -v --tb=short \
               --cov=app \
               --cov-report=term-missing \
               --cov-report=xml \
               --cov-report=html \
               --cov-fail-under=70 \
               -m "unit"

    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: 📋 Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov/

  # 통합 테스트
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: 🔐 Setup test environment
      run: |
        echo "SECRET_KEY=test-secret-key-for-integration-tests-at-least-32-characters" >> .env
        echo "ENVIRONMENT=test" >> .env
        echo "DEBUG=false" >> .env
        echo "REDIS_URL=redis://localhost:6379/1" >> .env
        echo "DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/test_db" >> .env
        echo "USE_REAL_AMADEUS=false" >> .env

    - name: 🔗 Run integration tests
      run: |
        pytest tests/ -v --tb=short \
               -m "integration" \
               --maxfail=3

    - name: 📡 Run API tests
      run: |
        # API 서버 백그라운드 시작
        uvicorn app.main:app --port 8000 &
        sleep 10

        # API 테스트 실행
        pytest tests/ -v --tb=short \
               -m "api" \
               --maxfail=3

  # 보안 검사
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml] safety

    - name: 🛡️ Run Bandit security scan
      run: |
        bandit -r app/ -f json -o bandit-report.json
        bandit -r app/ -f txt

    - name: 🔒 Check dependencies for vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check

    - name: 📋 Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  # 성능 테스트
  performance-test:
    name: ⚡ Performance Test
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'pull_request'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install locust

    - name: 🔐 Setup environment
      run: |
        echo "SECRET_KEY=performance-test-secret-key-at-least-32-characters-long" >> .env
        echo "ENVIRONMENT=test" >> .env
        echo "REDIS_URL=redis://localhost:6379/0" >> .env
        echo "USE_REAL_AMADEUS=false" >> .env

    - name: 🚀 Start application
      run: |
        uvicorn app.main:app --port 8000 &
        sleep 10

    - name: ⚡ Run performance tests
      run: |
        # 기본 헬스체크
        curl -f http://localhost:8000/health

        # 간단한 부하 테스트 (실제 환경에서는 더 정교한 테스트 필요)
        for i in {1..10}; do
          curl -s http://localhost:8000/api/v1/regions/lowest-prices > /dev/null &
        done
        wait

        echo "✅ Performance test completed"

  # 배포 준비 (main 브랜치에만)
  deploy-ready:
    name: 🚀 Deploy Ready
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🏷️ Create release tag
      if: contains(github.event.head_commit.message, '[release]')
      run: |
        # 버전 태그 생성 (commitizen 사용)
        pip install commitizen
        cz bump --yes
        git push --tags

    - name: 📦 Build Docker image
      run: |
        echo "🐳 Building Docker image..."
        # docker build -t flight-analyzer:${{ github.sha }} .
        echo "✅ Docker build simulation completed"

    - name: 🚀 Deploy notification
      run: |
        echo "🎉 Ready for deployment!"
        echo "- All tests passed"
        echo "- Security checks completed"
        echo "- Code quality verified"

  # 알림
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-scan]
    if: always()

    steps:
    - name: 📢 Success notification
      if: ${{ needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success' }}
      run: |
        echo "🎉 All tests passed successfully!"
        echo "- ✅ Code quality checks passed"
        echo "- ✅ Unit tests passed"
        echo "- ✅ Integration tests passed"
        echo "- ✅ Security scans completed"

    - name: ❌ Failure notification
      if: ${{ needs.unit-tests.result == 'failure' || needs.integration-tests.result == 'failure' }}
      run: |
        echo "❌ CI Pipeline failed!"
        echo "Please check the failed jobs and fix the issues."
        exit 1
