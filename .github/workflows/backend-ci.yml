name: Backend CI
on:
  push:
    branches: [main, develop, 'feat/**', 'refactor/**', 'fix/**', 'chore/**']
    paths: ['backend/**', '.github/workflows/backend-ci.yml', '.pre-commit-config.yaml']
  pull_request:
    branches: [main, develop]
    paths: ['backend/**', '.github/workflows/backend-ci.yml', '.pre-commit-config.yaml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check formatting and critical lint errors
        run: |
          black --check app tests conftest.py alembic
          isort --check-only app tests conftest.py alembic
          flake8 app tests conftest.py alembic --select E9,F63,F7,F82 --show-source
      - name: Run every test and report whole-app coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Enforce coverage of the integrated search path
        run: coverage report --include='app/main.py,app/api/v1/flights.py,app/api/v1/regions.py,app/config/settings.py,app/core/database.py,app/models/flight_requests.py,app/services/amadeus_service.py,app/services/exchange_rate_service.py,app/services/monthly_price_analyzer.py,app/services/monthly_data_collection_service.py,app/services/price_history_service.py,app/tasks/monthly_data_collection.py,app/utils/cache_keys.py,app/utils/decorators.py,app/utils/response_enhancers.py' --fail-under=80
