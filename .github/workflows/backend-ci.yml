name: Backend CI
on:
  push:
    branches: [main, develop, 'feat/**', 'refactor/**', 'fix/**', 'chore/**']
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: flight_test
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379/tcp']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.19'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Check formatting and critical lint errors
        run: |
          uv run --locked black --check app tests conftest.py alembic
          uv run --locked isort --check-only app tests conftest.py alembic
          uv run --locked flake8 app tests conftest.py alembic --select E9,F63,F7,F82 --show-source
      - name: Run every test and report whole-app coverage
        env:
          TEST_POSTGRES_URL: postgresql://postgres:local-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/flight_test
          TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/0
        run: uv run --locked pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Enforce coverage of the integrated search path
        run: uv run --locked coverage report --include='app/main.py,app/api/v1/flights.py,app/api/v1/regions.py,app/config/settings.py,app/core/database.py,app/models/flight_requests.py,app/services/amadeus_service.py,app/services/exchange_rate_service.py,app/services/monthly_price_analyzer.py,app/services/monthly_search_service.py,app/services/provider_http.py,app/services/provider_source.py,app/services/price_history_service.py,app/tasks/monthly_data_collection.py,app/utils/cache_keys.py,app/utils/decorators.py,app/utils/response_enhancers.py' --fail-under=80
